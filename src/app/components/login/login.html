<div class="login-container">
  <!-- Gradient background avec motif centre commercial -->
  <div class="gradient-bg"></div>

  <div class="login-wrapper">
    <!-- Logo / Header -->
    <div class="login-header">
      <div class="shopping-mall-icon">🏬</div>
      <h1>Centre Commercial</h1>
      <p>Connectez-vous à votre compte</p>
    </div>

    <!-- Formulaire de connexion -->
    <mat-card class="login-card">
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Champ Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Adresse Email</mat-label>
            <input matInput 
                   type="email" 
                   formControlName="email">
            <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              {{ getEmailErrorMessage() }}
            </mat-error>
          </mat-form-field>

          <!-- Champ Mot de passe -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe</mat-label>
            <input matInput 
                   [type]="hidePassword ? 'password' : 'text'" 
                   formControlName="password">
            <button mat-icon-button matSuffix
                    (click)="togglePasswordVisibility()"
                    type="button"
                    aria-label="Toggle password visibility">
              <mat-icon *ngIf="hidePassword">visibility_off</mat-icon>
              <mat-icon *ngIf="!hidePassword">visibility</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              {{ getPasswordErrorMessage() }}
            </mat-error>
          </mat-form-field>

          <!-- Se souvenir de moi -->
          <mat-checkbox formControlName="rememberMe" class="remember-me">
            Se souvenir de moi
          </mat-checkbox>

          <!-- Bouton de connexion -->
          <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  class="login-button"
                  [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading">
              <mat-icon class="spinner">hourglass_top</mat-icon>
              Connexion en cours...
            </span>
          </button>

          <!-- Liens supplémentaires -->
          <div class="links-container">
            <a href="#" class="link">Mot de passe oublié?</a>
            <a href="/register" class="link">Créer un compte</a>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <!-- Pied de page -->
    <div class="login-footer">
      <p>© 2026 Centre Commercial. Tous droits réservés.</p>
    </div>
  </div>
</div>
