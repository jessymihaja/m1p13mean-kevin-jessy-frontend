<div class="inventory-container">
  <h3>Inventaire</h3>
  <div class="inventory-controls">
    <input type="text" [(ngModel)]="searchText" placeholder="Rechercher un produit...">
    <button (click)="addProduct()">Ajouter un produit</button>
  </div>
  <table class="inventory-table">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Description</th>
      <th>Prix</th>
      <th>Catégorie</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of filteredProducts()">
      <td>{{ p.name }}</td>
      <td>{{ p.description }}</td>
      <td>{{ p.price | currency:'EUR' }}</td>
      <td>{{ p.category }}</td>
      <td>
        <button class="edit-btn" (click)="editProduct(p)">Modifier</button>
        <button class="delete-btn" (click)="deleteProduct(p._id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
