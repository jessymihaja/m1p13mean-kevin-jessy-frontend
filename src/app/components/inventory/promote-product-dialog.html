<h2 mat-dialog-title>Promouvoir le produit</h2>
<div mat-dialog-content>
  <form>
    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Date de début</mat-label>
      <input matInput [matDatepicker]="picker1" [(ngModel)]="start" name="start">
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Date de fin</mat-label>
      <input matInput [matDatepicker]="picker2" [(ngModel)]="end" name="end">
      <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onNoClick()">Annuler</button>
  <button mat-button color="primary" [disabled]="!start || !end" (click)="save()">Enregistrer</button>
</div>
