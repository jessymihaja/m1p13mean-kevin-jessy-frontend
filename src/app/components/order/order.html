<div class="orders-container">
  <h3>Commandes</h3>
  <div class="order-card" *ngFor="let o of orders">
    <mat-card>
      <mat-card-title>Commande {{ o._id }}</mat-card-title>
      <mat-card-subtitle>{{ o.shop }} - {{ o.client }}</mat-card-subtitle>
      <mat-card-content>
        <p>Date&nbsp;: {{ o.date | date:'shortDate' }}</p>
        <ul>
          <li *ngFor="let p of o.products">
            {{ p.name }} x {{ p.qty }}
          </li>
        </ul>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" (click)="markProcessed(o)">Traité</button>
        <button mat-button color="accent" (click)="generateInvoice(o)">Générer facture</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
